<div class="answer-card-float" id="float">
<div class="sheet" id="demo">
  <p class="sheet-tag">Sample question. Nothing here is saved.</p>
  <h2 class="sheet-q" id="demoQ">The faculty explains concepts in a way I can follow.</h2>
  <div class="scale" role="radiogroup" aria-labelledby="demoQ">
    <button type="button" class="bubble" role="radio" aria-checked="false" data-label="Poor"><i></i><span>Poor</span></button>
    <button type="button" class="bubble" role="radio" aria-checked="false" data-label="Average"><i></i><span>Average</span></button>
    <button type="button" class="bubble" role="radio" aria-checked="false" data-label="Good"><i></i><span>Good</span></button>
    <button type="button" class="bubble" role="radio" aria-checked="false" data-label="Very good"><i></i><span>Very good</span></button>
    <button type="button" class="bubble" role="radio" aria-checked="false" data-label="Excellent"><i></i><span>Excellent</span></button>
  </div>
  <div class="receipt" aria-live="polite">
    <p class="receipt-idle" id="receiptIdle">Tap a bubble to see what gets saved.</p>
    <div class="receipt-body" id="receiptBody" hidden>
      <div><h3>Saved with the answer</h3><p class="receipt-saved">Rating: <strong id="pickLabel">Very good</strong></p></div>
      <div><h3>Never attached</h3><ul><li>Your name</li><li>Your roll number</li></ul></div>
    </div>
  </div>
  <div class="stamp" aria-hidden="true">
    <div class="stamp-ring"></div>
    <svg viewBox="0 0 200 200" focusable="false">
      <defs><path id="stTop" d="M28,100 a72,72 0 0,1 144,0"/><path id="stBot" d="M20,100 a80,80 0 0,0 160,0"/></defs>
      <circle cx="100" cy="100" r="94" fill="none" stroke="#0b2f6b" stroke-width="5"/>
      <circle cx="100" cy="100" r="86" fill="none" stroke="#0b2f6b" stroke-width="1.5"/>
      <circle cx="100" cy="100" r="52" fill="#fff" stroke="#f26f21" stroke-width="3"/>
      <text font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="15" letter-spacing="1.6" fill="#0b2f6b"><textPath href="#stTop" startOffset="50%" text-anchor="middle">ADITYA UNIVERSITY</textPath></text>
      <text font-family="Arial,sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" fill="#f26f21"><textPath href="#stBot" startOffset="50%" text-anchor="middle">ANONYMOUS FEEDBACK</textPath></text>
      <text x="12" y="106" font-size="13" fill="#0b2f6b">&#9733;</text><text x="176" y="106" font-size="13" fill="#0b2f6b">&#9733;</text>
      <image href="{{ url_for('static', filename='img/aditya-emblem.png') }}" x="72" y="72" width="56" height="58" preserveAspectRatio="xMidYMid meet"/>
    </svg>
  </div>
  <div class="sheet-fold" aria-hidden="true"><i></i></div>
</div>
