<div id="rm-overlay" hidden style="position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:2.5vh 0;overflow:auto"></div>
<script>
(function(){
  var ov=document.getElementById('rm-overlay');
  if(!ov) return;
  function close(){ ov.hidden=true; ov.innerHTML=''; document.body.style.overflow=''; }
  function items(){ return [].slice.call(ov.querySelectorAll('[data-rm-list] .rm-cm')); }
  function state(){ return ov.dataset.filter || 'all'; }
  function apply(){
    var modal=ov.querySelector('.rm-modal'); if(!modal) return;
    var limit=parseInt(modal.getAttribute('data-limit'),10)||5;
    var shown=parseInt(ov.dataset.shown||limit,10);
    var f=state(), match=items().filter(function(el){ return f==='all' || el.getAttribute('data-tag')===f; });
    items().forEach(function(el){ el.style.display='none'; });
    match.slice(0,shown).forEach(function(el){ el.style.display=''; });
    var none=ov.querySelector('[data-rm-none]'); if(none) none.hidden = match.length>0;
    var more=ov.querySelector('[data-rm-more]');
    var left=match.length-shown;
    if(more){ more.hidden = left<=0; more.textContent='Show more comments ('+left+' left)'; }
    ov.querySelectorAll('[data-rm-filter]').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-rm-filter')===f);
    });
  }
  function open(url){
    fetch(url,{credentials:'same-origin'}).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status); return r.text();
    }).then(function(html){
      ov.innerHTML=html; ov.dataset.filter='all'; ov.dataset.shown=5;
      ov.hidden=false; document.body.style.overflow='hidden'; apply();
    }).catch(function(){ alert('Could not open this result. Please try again.'); });
  }
  document.addEventListener('click',function(e){
    var v=e.target.closest('.js-view-result');
    if(v){ e.preventDefault(); open(v.getAttribute('data-url')); return; }
    if(ov.hidden) return;
    if(e.target===ov || e.target.closest('[data-rm-close]')){ close(); return; }
    var fb=e.target.closest('[data-rm-filter]');
    if(fb){ ov.dataset.filter=fb.getAttribute('data-rm-filter'); ov.dataset.shown=5; apply(); return; }
    if(e.target.closest('[data-rm-more]')){ ov.dataset.shown=parseInt(ov.dataset.shown||5,10)+5; apply(); return; }
    var tg=e.target.closest('[data-rm-toggle]');
    if(tg){
      var wrap=ov.querySelector('[data-rm-wrap]'); var hide=!wrap.hidden; wrap.hidden=hide;
      var t=ov.querySelector('.rm-toggle');
      if(t){ t.setAttribute('aria-expanded', String(!hide));
        var n=items().length; t.textContent=(hide?'Show':'Hide')+' student comments ('+n+')'; }
      return;
    }
    if(e.target.closest('[data-rm-howto]')){ alert('Each comment is tagged by the star rating its student gave: 4–5 stars = Positive, 3 = Neutral, 1–2 = Needs improvement.'); }
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !ov.hidden) close(); });
})();
</script>
